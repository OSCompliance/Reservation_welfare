version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: welfare-postgres
    environment:
      POSTGRES_USER: welfare
      POSTGRES_PASSWORD: welfare123
      POSTGRES_DB: welfare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U welfare"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - welfare-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: welfare-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - welfare-network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: welfare-backend
    environment:
      DATABASE_URL: postgresql://welfare:welfare123@postgres:5432/welfare_db
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - welfare-network

  # Next.js Frontend (optional for docker-compose)
  # Frontend is typically run separately with `npm run dev`
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: welfare-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_DEFAULT_LANGUAGE: ta
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - welfare-network

networks:
  welfare-network:
    driver: bridge

volumes:
  postgres_data:
